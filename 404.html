<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>صفحة غير موجودة | FRIENDS Store - مستلزمات طبية</title>
  <meta name="description" content="الصفحة التي تبحث عنها غير موجودة. تصفح أقسام FRIENDS Store للعثور على ما تحتاجه." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://friendss.org/404" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/images/friends-icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .not-found {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem;
    }
    .not-found-code {
      font-size: clamp(4rem, 15vw, 8rem);
      font-weight: 700;
      color: var(--brand, #0d9488);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .not-found-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .not-found-text {
      color: var(--muted, #64748b);
      margin-bottom: 2rem;
      max-width: 400px;
    }
    .not-found-links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .not-found-links a {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 500;
      text-decoration: none;
    }
    .not-found-links .btn-home {
      background: var(--brand, #0d9488);
      color: white;
    }
    .not-found-links .btn-cat {
      background: var(--surface-alt, #f1f5f9);
      color: var(--text, #1e293b);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="not-found">
      <div class="not-found-code">404</div>
      <h1 class="not-found-title">الصفحة غير موجودة</h1>
      <p class="not-found-text">عذراً، الصفحة التي تبحث عنها غير متاحة أو تم نقلها. يمكنك العودة للصفحة الرئيسية أو تصفح الأقسام.</p>
      <div class="not-found-links">
        <a href="/" class="btn-home">الصفحة الرئيسية</a>
        <a href="/#categories" class="btn-cat">تصفح الأقسام</a>
        <a href="/#products" class="btn-cat">المنتجات</a>
      </div>
    </div>
  </div>
</body>
</html>
