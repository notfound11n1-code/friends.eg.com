<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="iconHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072b61" />
      <stop offset="40%" stop-color="#0e5ca8" />
      <stop offset="80%" stop-color="#00a8cc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="iconHeartLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077b6" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#90e0ef" />
    </linearGradient>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#041a38" flood-opacity="0.3" />
    </filter>
  </defs>

  <g id="iconEmblem" filter="url(#iconShadow)">
    <!-- Outer Right Wing -->
    <path d="M 60 18 
             C 76 -1, 108 5, 110 36 
             C 112 66, 84 90, 60 110 
             C 48 100, 32 87, 22 74
             C 28 82, 44 94, 60 102
             C 80 84, 100 62, 98 36
             C 96 15, 74 11, 60 24 Z" 
          fill="url(#iconHeartLight)" />

    <!-- Left Wing & F -->
    <path d="M 40 8 
             C 18 8, 2 27, 2 50 
             C 2 75, 24 95, 60 112 
             C 58 107, 56 101, 54 95
             C 26 82, 14 66, 14 50 
             C 14 33, 26 20, 42 20 
             C 51 20, 57 24, 60 28
             L 60 14 
             C 54 10, 47 8, 40 8 Z" 
          fill="url(#iconHeartGrad)" />

    <!-- F Crossbars -->
    <path d="M 24 30 L 36 30 L 26 90 L 14 90 Z" fill="url(#iconHeartGrad)" />
    <path d="M 24 30 L 56 24 L 54 36 L 25 40 Z" fill="url(#iconHeartLight)" />
    <path d="M 20 55 L 48 51 L 46 61 L 18 64 Z" fill="url(#iconHeartLight)" />

    <!-- Medical Cross Badge in Center -->
    <g transform="translate(68, 48)">
      <circle cx="8" cy="8" r="9" fill="url(#iconHeartLight)" stroke="#ffffff" stroke-width="1.5" />
      <path d="M 6.5 3.5 L 9.5 3.5 L 9.5 6.5 L 12.5 6.5 L 12.5 9.5 L 9.5 9.5 L 9.5 12.5 L 6.5 12.5 L 6.5 9.5 L 3.5 9.5 L 3.5 6.5 L 6.5 6.5 Z" fill="#ffffff" />
    </g>
  </g>
</svg>
