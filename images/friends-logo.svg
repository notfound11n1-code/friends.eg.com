<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="100%" height="100%">
  <defs>
    <!-- Deep Royal to Brilliant Cyan Gradients -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072b61" />
      <stop offset="35%" stop-color="#0e5ca8" />
      <stop offset="70%" stop-color="#00a8cc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="heartGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077b6" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#90e0ef" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c3b6d" />
      <stop offset="40%" stop-color="#0096c7" />
      <stop offset="60%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0c3b6d" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08254e" />
      <stop offset="45%" stop-color="#0e4b8a" />
      <stop offset="100%" stop-color="#061c3b" />
    </linearGradient>

    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#041a38" flood-opacity="0.25" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group: Logo Symbol & Typography -->
  <g id="friendsLogo" transform="translate(10, 8)">
    <!-- Heart & F Graphic Emblem -->
    <g id="emblem" filter="url(#logoShadow)">
      <!-- Outer Heart curve (Right wing) -->
      <path d="M 68 18 
               C 85 -2, 118 4, 120 36 
               C 122 66, 92 90, 68 112 
               C 56 102, 38 88, 28 74
               C 34 82, 52 94, 68 104
               C 88 84, 110 62, 108 36
               C 106 14, 82 10, 68 24 Z" 
            fill="url(#heartGradLight)" opacity="0.95" />

      <!-- Left F & Heart Wing -->
      <path d="M 46 8 
               C 22 8, 4 28, 4 52 
               C 4 78, 28 98, 68 115 
               C 66 110, 64 104, 62 98
               C 30 84, 16 68, 16 52 
               C 16 34, 30 20, 48 20 
               C 58 20, 65 24, 68 28
               L 68 14 
               C 62 10, 54 8, 46 8 Z" 
            fill="url(#heartGrad)" />

      <!-- Stylized 'F' Stem & Crossbars interlocking with heart -->
      <!-- Main vertical bar of F -->
      <path d="M 28 32 L 40 32 L 30 94 L 18 94 Z" fill="url(#heartGrad)" />
      <!-- Top bar of F -->
      <path d="M 28 32 L 62 26 L 60 38 L 29 42 Z" fill="url(#heartGradLight)" />
      <!-- Middle bar of F -->
      <path d="M 24 58 L 54 54 L 52 64 L 22 67 Z" fill="url(#heartGradLight)" />
    </g>

    <!-- Wordmark "Friends" with custom medical typography -->
    <g id="wordmark" transform="translate(68, 18)" filter="url(#logoShadow)">
      <!-- Main "riends" text rendered with geometric clean medical curves -->
      <text x="56" y="52" 
            font-family="'Montserrat', 'Segoe UI', 'Tajawal', sans-serif" 
            font-size="44" 
            font-weight="900" 
            letter-spacing="-0.5" 
            fill="url(#textGrad)">
        riends
      </text>

      <!-- Medical Cross inside dot of 'i' -->
      <g transform="translate(73.5, 17)">
        <!-- Circle background with cyan gradient -->
        <circle cx="6" cy="6" r="6.5" fill="url(#heartGradLight)" />
        <!-- White Cross -->
        <path d="M 4.5 2.5 L 7.5 2.5 L 7.5 4.5 L 9.5 4.5 L 9.5 7.5 L 7.5 7.5 L 7.5 9.5 L 4.5 9.5 L 4.5 7.5 L 2.5 7.5 L 2.5 4.5 L 4.5 4.5 Z" fill="#ffffff" />
      </g>

      <!-- ECG / Pulse Line (نبض القلب الطبي) -->
      <g transform="translate(0, 62)">
        <!-- Underlying soft line -->
        <line x1="10" y1="5" x2="200" y2="5" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
        <!-- Vivid ECG Pulse Waveform -->
        <path d="M 10 5 
                 L 75 5 
                 L 82 5 
                 L 86 -4 
                 L 91 14 
                 L 97 -8 
                 L 102 9 
                 L 106 5 
                 L 200 5" 
              fill="none" 
              stroke="url(#pulseGrad)" 
              stroke-width="3" 
              stroke-linecap="round" 
              stroke-linejoin="round" 
              filter="url(#glow)" />
      </g>

      <!-- Subtitle: "For Medical Supplies" -->
      <text x="105" y="80" 
            text-anchor="middle" 
            font-family="'Montserrat', 'Tajawal', sans-serif" 
            font-size="11.5" 
            font-weight="800" 
            letter-spacing="1.8" 
            fill="#08254e">
        FOR MEDICAL SUPPLIES
      </text>
    </g>

    <!-- Slogan in Arabic underneath with elegant dual swooshes: "ثقتكم .. مسؤوليتنا الطبية" -->
    <g transform="translate(195, 116)">
      <!-- Left Swoosh Line -->
      <path d="M 0 0 C 25 -3, 50 -1, 70 0" stroke="#0096c7" stroke-width="1.8" fill="none" stroke-linecap="round" />
      <!-- Slogan Arabic Text -->
      <text x="135" y="4" 
            text-anchor="middle" 
            font-family="'Reem Kufi', 'Tajawal', sans-serif" 
            font-size="13" 
            font-weight="700" 
            fill="#083d6d" 
            letter-spacing="0.5">
        ثقتكم .. مسؤوليتنا الطبية
      </text>
      <!-- Right Swoosh Line -->
      <path d="M 200 0 C 220 -1, 245 -3, 270 0" stroke="#0096c7" stroke-width="1.8" fill="none" stroke-linecap="round" />
    </g>
  </g>
</svg>
