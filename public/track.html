<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="title.track">FRIENDS | تتبع الطلب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Harmattan:wght@400;600;700&family=Reem+Kufi:wght@400;500;600;700&family=Changa:wght@400;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="track">
  <!-- Announcement -->
  <div class="announcement">
    <div class="container announcement-inner">
      <div class="announcement-brand-slogan">
        <span class="announcement-pulse-dot"></span>
        <strong class="slogan-text" data-i18n="announcement.slogan">ثقتكم .. مسؤوليتنا الطبية</strong>
        <span class="announcement-sep">•</span>
        <span class="announcement-sub" data-i18n="announcement.tagline">مستلزمات وأجهزة طبية أصلية 100%</span>
      </div>
      <div class="announcement-quick-info">
        <a href="tel:01061806140" class="announcement-contact" dir="ltr">
          <span class="contact-icon">📞</span>
          <span>01061806140</span>
        </a>
      </div>
    </div>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Friends Medical Supplies">
        <div class="logo">
          <img src="images/friends-logo.svg" alt="Friends For Medical Supplies - فريندز للمستلزمات الطبية" />
        </div>
      </a>

      <nav class="main-nav">
        <a class="nav-link" href="index.html"><span class="nav-icon">⌂</span><span data-i18n="nav.home">الرئيسية</span></a>
        <a class="nav-link" href="index.html#offers"><span class="nav-icon-badge">%</span><span data-i18n="nav.offers">العروض</span></a>
        <a class="nav-link" href="index.html#categories"><span class="nav-icon">▦</span><span data-i18n="nav.categories">الأقسام</span></a>
        <a class="nav-link active" href="track.html"><span class="nav-icon">◎</span><span data-i18n="nav.track">تتبع الطلب</span></a>
      </nav>

      <div class="header-actions">
        <div class="header-user-actions">
          <a class="header-cart-btn" href="cart.html" aria-label="عربة التسوق">
            <span class="cart-icon-wrap">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
              <span class="cart-count-badge" id="headerCartCount" style="display:none;">0</span>
            </span>
            <span class="cart-btn-label" data-i18n="nav.cart">السلة</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="card auth-card">
          <h3 data-i18n="track.title">تتبع الطلب</h3>
          <label class="input-label" data-i18n="track.order_code_label">كود الطلب (أول 8 أحرف)</label>
          <input id="trackOrderCode" type="text" placeholder="مثال: a1b2c3d4" data-i18n-placeholder="track.order_code_placeholder" />

          <label class="input-label" data-i18n="track.phone_label">رقم الهاتف</label>
          <input id="trackPhone" type="tel" placeholder="01XXXXXXXXX" data-i18n-placeholder="track.phone_placeholder" />

          <button class="btn primary" id="trackBtn" data-i18n="action.track_now">تتبع الآن</button>
          <p class="note" id="trackMsg"></p>
        </div>

        <div class="card" id="trackResult" style="display:none; margin-top: 18px;"></div>
      </div>
    </section>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/track.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
